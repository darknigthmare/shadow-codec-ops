<!doctype html><meta charset="UTF-8"><title>Crying Wolf + Crying Beauty alpha compositing review</title><style>body{background:#171a18;color:#eee;font:16px sans-serif;margin:8px}canvas{display:block;max-width:100%;height:auto}button{padding:6px;margin:3px}</style><h1>Crying Wolf + Crying Beauty native Canvas alpha review</h1><p>Actual alpha compositing with native PNG bytes; 195px quadrupedal shoulder-to-paw height and230px human height. No raster edits.</p><div id="buttons"></div><canvas id="c" width="2000" height="980"></canvas><script>window.__consoleErrors=[];addEventListener('error',e=>window.__consoleErrors.push(e.message));let ds; const cv=document.querySelector('canvas'),ctx=cv.getContext('2d');window.drawSet=async(key,bg='#3c493e')=>{const d=ds.find(x=>x.key===key);const im=new Image();im.src=d.source;await im.decode();ctx.fillStyle=bg;ctx.fillRect(0,0,2000,980);ctx.fillStyle='#e7efeb';ctx.font='16px sans-serif';ctx.fillText(d.key+' / actual native alpha at '+d.displayHeight+'px',12,24);for(const cell of d.layout.cells){const f=cell.frame,[x,y,w,h]=f.rect,s=d.displayHeight/d.height,p=f.pivot;const dx=250+(cell.index%4)*500-w*p[0]*s,dy=320+Math.floor(cell.index/4)*320-h*p[1]*s;ctx.save();if(f.clipPolygon){ctx.beginPath();f.clipPolygon.forEach((q,i)=>{const px=dx+q[0]*w*s,py=dy+q[1]*h*s;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py)});ctx.closePath();ctx.clip()}ctx.drawImage(im,x,y,w,h,dx,dy,w*s,h*s);ctx.restore();ctx.fillStyle='#e7efeb';ctx.fillText('pose'+cell.index,20+(cell.index%4)*500,64+Math.floor(cell.index/4)*320)}window.lastKey=key;return {key,cells:d.layout.cells.length,width:im.width,height:im.height,errors:window.__consoleErrors}};fetch('preview-data.json').then(r=>r.json()).then(async r=>{ds=r;for(const x of ds){const b=document.createElement('button');b.textContent=x.key;b.onclick=()=>drawSet(x.key);document.querySelector('#buttons').append(b)}await drawSet(ds[0].key);window.ready=true})</script>
