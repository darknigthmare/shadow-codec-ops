<!doctype html><html lang="fr"><meta charset="utf-8"><title>Raging beauty PASS8 native Canvas review</title><style>body{margin:0;background:#28313a;color:#f7f7f7;font:16px sans-serif}button{padding:10px;margin:5px}canvas{display:block}#state{padding:10px}</style><div id="buttons"></div><div id="state">Chargement sprites natifs</div><canvas id="sheet" width="1600" height="840"></canvas><script>window.__consoleErrors=[];window.addEventListener('error',e=>window.__consoleErrors.push(e.message)); const c=document.getElementById('sheet'),ctx=c.getContext('2d');window.__ready=false;let data,images={};const draw=key=>{ctx.fillStyle='#d7e0e8';ctx.fillRect(0,0,c.width,c.height);const d=data.layouts[key],im=images[key],s=200/data.scale[key];for(const cell of d.cells){const x=cell.col*400,y=cell.row*280,rect=cell.frame.rect;ctx.strokeStyle='#8598a7';ctx.strokeRect(x,y,400,280);ctx.fillStyle='#15232d';ctx.font='16px sans-serif';ctx.fillText(key+' '+cell.index,x+10,y+20);ctx.save();ctx.translate(x+200+(rect[2]*cell.frame.pivot[0]-rect[2]/2)*s,y+260);ctx.scale(s,s);ctx.translate(-rect[2]*cell.frame.pivot[0],-rect[3]*cell.frame.pivot[1]);if(cell.frame.clipPolygon){ctx.beginPath();cell.frame.clipPolygon.forEach((p,i)=>i?ctx.lineTo(p[0]*rect[2],p[1]*rect[3]):ctx.moveTo(p[0]*rect[2],p[1]*rect[3]));ctx.closePath();ctx.clip();}ctx.drawImage(im,rect[0],rect[1],rect[2],rect[3],0,0,rect[2],rect[3]);ctx.restore();}document.getElementById('state').textContent=key+' : 12 poses originales, Canvas alpha natif, aucune édition PNG';window.__current=key;window.__ready=true;};fetch('preview-data.json').then(r=>r.json()).then(async d=>{data=d;for(const [key,name]of Object.entries(d.selected)){images[key]=await new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src='native-attempts/'+name+'.png';});const b=document.createElement('button');b.textContent=key;b.onclick=()=>draw(key);document.getElementById('buttons').appendChild(b);}window.draw=draw;draw('a-right');}).catch(e=>{window.__consoleErrors.push(String(e));document.getElementById('state').textContent=String(e)});</script></html>
