th=19;c.beginPath();c.moveTo(-34,-163);c.lineTo(-62,-103);c.moveTo(34,-163);c.lineTo(69,-127);c.stroke();c.strokeStyle=col;c.lineWidth=12;c.stroke();c.fillStyle=skin;c.strokeStyle='#06100c';c.lineWidth=4;c.beginPath();c.arc(0,-218,29,0,Math.PI*2);c.fill();c.stroke();c.fillStyle=v.hairColor||'#302b26';c.beginPath();c.arc(0,-229,30,Math.PI,0);c.fill();if(v.headgear){c.fillStyle=acc;c.fillRect(-31,-244,62,11)}c.fillStyle='#27343a';c.strokeStyle='#06100c';c.lineWidth=3;c.fillRect(47,-142,86,13);c.strokeRect(47,-142,86,13);c.restore()}function gamesFiltered(){const q=$('#search').value.toLowerCase(),st=$('#status').value;return AUDIT.titles.filter(t=>(!q||`${t.name} ${t.platform}`.toLowerCase().includes(q))&&(st==='ALL'||st==='NEW'&&t.newCount>0||st==='ROSTER'&&t.fighterCount>=8))}function buildGames(){const host=$('#games');host.innerHTML='';gamesFiltered().forEach(t=>{const b=document.createElement('button');b.className='game'+(t.id===selected?' active':'');b.innerHTML=`<b>${t.name}</b><small>${t.year} · ${t.platform} · ${t.fighterCount} PROFILS</small>${t.newCount?`<span class="new">+${t.newCount}</span>`:''}`;b.onclick=()=>{selected=t.id;picks=[];buildGames();renderDetail()};host.appendChild(b)})}function choose(uid){if(picks.includes(uid))picks=picks.filter(x=>x!==uid);else{picks.push(uid);if(picks.length>2)picks.shift()}renderDetail()}function renderDetail(){show('detail');const t=AUDIT.titles.find(x=>x.id===selected),members=t.roster.map(byUid).filter(Boolean);const host=$('#detail');host.innerHTML=`<div class="hero"><div><small style="color:var(--gold);font:900 8px ui-monospace">${t.year} · ${t.platform}</small><h2>${t.name}</h2></div><div class="status"><span class="pill ok">${t.status}</span>${t.newCount?`<span class="pill new">+${t.newCount} EN 0.50</span>`:''}</div></div><div class="summary"><div class="sum"><strong>${t.fighterCount}</strong><small>PROFILS VERSUS</small></div><div class="sum"><strong>${t.principalCovered}/${t.principalTotal}</strong><small>PERSONNAGES PRINCIPAUX</small></div><div class="sum"><strong>${t.bosses.length}</strong><small>BOSS NOMMÉS</small></div><div class="sum"><strong>${t.machines.length}</strong><small>MACHINES</small></div></div><h3 class="section-title">Roster de l’opus</h3><div class="roster" id="roster"></div><h3 class="section-title">Couverture du catalogue</h3><table class="cast-table"><thead><tr><th>PERSONNAGE</th><th>VERSUS / RÔLE</th><th>ÉTAT</th></tr></thead><tbody>${t.cast.map(c=>`<tr><td>${c.name}</td><td>${c.fighterUid?(byUid(c.fighterUid)?.name||c.fighterUid):'OPÉRATEUR / MISSION'}</td><td class="yes">${c.covered?'COUVERT':'OUVERT'}</td></tr>`).join('')}</tbody></table><div class="lists"><div class="listbox"><h3>Boss</h3>${t.bosses.map(x=>`<span>${x}</span>`).join('')||'<span>Aucun boss distinct</span>'}</div><div class="listbox"><h3>Machines</h3>${t.machines.map(x=>`<span>${x}</span>`).join('')||'<span>Aucune grande machine</span>'}</div><div class="listbox"><h3>Portée de l’audit</h3><span>${t.note}</span><span>Les machines restent dans Arsenal.</span><span>Les profils narratifs sont marqués comme simulations.</span></div></div><div class="duelbar"><div class="duel-slot"><small>P1</small><b>${picks[0]?(byUid(picks[0])?.name):'CHOISIR'}</b></div><span class="vs">VS</span><div class="duel-slot"><small>P2</small><b>${picks[1]?(byUid(picks[1])?.name):'CHOISIR'}</b></div><button class="launch" id="launch" ${picks.length<2?'disabled':''}>LANCER LE DUEL</button></div>`;const grid=$('#roster');members.forEach(f=>{const b=document.createElement('button');b.className='fighter'+(picks.includes(f.uid)?' selected':'');b.innerHTML=`${f.source==='ROSTER COMPLETION 0.50'?'<span class="tag">NEW 0.50</span>':''}<canvas width="220" height="100"></canvas><b>${f.name}</b><small>${f.role} · ${f.source}</small>`;b.onclick=()=>choose(f.uid);grid.appendChild(b);drawPortrait(b.querySelector('canvas'),f)});$('#launch').onclick=startDuel}function renderOverview(){show('overview');const host=$('#overview'),complete=AUDIT.titles.filter(t=>t.status==='PRINCIPAUX COUVERTS').length;host.innerHTML=`<div class="hero"><div><small style="color:var(--gold);font:900 8px ui-monospace">FRANCHISE COVERAGE</small><h2>VUE GLOBALE.</h2></div><span class="pill ok">${complete}/${AUDIT.titleCount} PRINCIPAUX COUVERTS</span></div><div class="summary"><div class="sum"><strong>${AUDIT.fighterCount}</strong><small>COMBATTANTS</small></div><div class="sum"><strong>${AUDIT.addedCount}</strong><small>AJOUTS 0.50</small></div><div class="sum"><strong>${AUDIT.titleCount}</strong><small>OPUS / FORMATS</small></div><div class="sum"><strong>${AUDIT.titles.reduce((a,t)=>a+t.newCount,0)}</strong><small>PROFILS DISTRIBUÉS</small></div></div><div class="overview-grid">${AUDIT.titles.map(t=>`<button class="overview-card" data-id="${t.id}"><strong>${t.fighterCount}</strong><b>${t.name}</b><p>${t.status} · ${t.newCount?`+${t.newCount} en v0.50`:'roster conservé'}</p></button>`).join('')}</div>`;host.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;picks=[];buildGames();renderDetail()})}function renderGaps(){show('gaps');$('#gaps').innerHTML=`<div class="hero"><div><small style="color:var(--gold);font:900 8px ui-monospace">HONEST COMPLETION SCOPE</small><h2>CE QUI RESTE<br>OUVERT.</h2></div></div><div class="overview-grid"><div class="overview-card"><strong>0</strong><b>Personnage principal du catalogue non couvert</b><p>La couverture vise les castings principaux nommés des 31 entrées suivies.</p></div><div class="overview-card"><strong>+</strong><b>Personnages secondaires</b><p>Chaque garde nommé, costume régional, figurant ou variante promotionnelle n’est pas automatiquement un combattant distinct.</p></div><div class="overview-card"><strong>ARSENAL</strong><b>Grandes machines</b><p>REX, RAY, ZEKE, Gander ou Sahelanthropus restent à leur échelle dans Arsenal.</p></div><div class="overview-card"><strong>SIM</strong><b>Opérateurs et civils</b><p>Leur participation au Versus est explicitement une simulation non canonique.</p></div><div class="overview-card"><strong>ART</strong><b>Sprites définitifs</b><p>Les profils procéduraux préparent les futurs atlas complets mais ne les remplacent pas.</p></div><div class="overview-card"><strong>QA</strong><b>Équilibrage humain</b><p>La validation structurelle ne remplace pas plusieurs centaines d’heures de tests compétitifs humains.</p></div></div>`}function startDuel(){if(picks.length<2)return;$('#fight').classList.remove('hidden');const f=$('#fightFrame');const cfg={type:'cqc-versus-start',config:{p1:picks[0],p2:picks[1],mode:'cpu',rounds:2,seconds:99,finishers:'stylized',source:'roster-command'}};if(ready)f.contentWindow.postMessage(cfg,'*');else setTimeout(()=>f.contentWindow.postMessage(cfg,'*'),350)}addEventListener('message',e=>{if(e.data?.type==='cqc-versus-ready'){ready=true;if(!$('#fight').classList.contains('hidden')&&picks.length===2)startDuel()}});$('#closeFight').onclick=()=>{$('#fight').classList.add('hidden');$('#fightFrame').contentWindow.postMessage({type:'cqc-versus-abort'},'*')};$('#command').onclick=()=>parent!==window?parent.postMessage({type:'cqc-admin-close'},'*'):history.back();$('#overviewBtn').onclick=renderOverview;$('#gapsBtn').onclick=renderGaps;$('#search').oninput=buildGames;$('#status').onchange=buildGames;window.__CQC050Roster={audit:AUDIT,fighters:FIGHTERS,showTitle:id=>{selected=id;picks=[];buildGames();renderDetail()},getPicks:()=>picks.slice(),version:'0.50'};buildGames();renderDetail();})();
