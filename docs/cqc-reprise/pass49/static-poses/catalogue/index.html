<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>CQC — Archives des tenues</title>
  <link rel="stylesheet" href="catalog.css">
  <script type="module" src="catalog.mjs"></script>
</head>
<body>
  <header class="masthead">
    <div><p class="eyebrow">CQC / ARCHIVES</p><h1>Tenues des combattants</h1><p class="intro">Une pose par tenue. Les incarnations restent séparées.</p></div>
    <div class="stamp" aria-hidden="true">FIELD<br>ARCHIVE</div>
  </header>
  <main>
    <section class="controls" aria-label="Rechercher une tenue">
      <label class="search-label">Dossier<input id="search" type="search" placeholder="Personnage, tenue ou époque…" autocomplete="off"></label>
      <label>État<select id="status"><option value="">Tous les états</option><option value="drawn">Dessin disponible</option><option value="missing">À dessiner</option><option value="review">À vérifier</option></select></label>
      <label>Provenance<select id="origin"><option value="">Toutes les tenues</option><option value="original">Tenue d’origine</option><option value="official">Archives officielles</option><option value="invented">Création</option></select></label>
      <label>Époque<select id="era"><option value="">Toutes les époques</option></select></label>
      <label>Collection<select id="family"><option value="">Toutes les collections</option></select></label>
      <button id="reset" type="button">Effacer les filtres</button>
    </section>
    <div class="archive-line"><p id="summary" aria-live="polite">Ouverture des dossiers…</p><p id="snapshot"></p></div>
    <p id="notice" class="notice" role="status" hidden></p>
    <section id="cards" class="cards" aria-label="Tenues"></section>
    <nav class="pagination" aria-label="Pages de dossiers"><button id="previous" type="button">← Précédent</button><span id="page-label" aria-live="polite"></span><button id="next" type="button">Suivant →</button></nav>
  </main>
  <footer>Les planches d’origine restent intactes. Un dossier à dessiner n’utilise aucun portrait de remplacement.</footer>
</body>
</html>
