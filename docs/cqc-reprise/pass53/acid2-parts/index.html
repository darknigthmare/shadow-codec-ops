<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AC!D 2 · Équipement séparé</title>
<style>*{box-sizing:border-box}body{margin:0;color:#ebeee8;background:#121714;font:16px system-ui}main{max-width:860px;margin:auto;padding:24px}h1{font-size:clamp(1.5rem,5vw,2.4rem)}section{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(12rem,1fr);gap:20px}canvas{width:100%;height:auto;max-height:66vh;object-fit:contain;background:#262b28}label{display:block;margin:.65rem 0}select,input{accent-color:#d9bc7d}select{font:inherit;padding:.35rem}a{color:#d9bc7d}p{max-width:70ch}@media(max-width:540px){section{grid-template-columns:1fr}canvas{max-height:45vh}}</style>

<label>Combattant <select id="actor"><option value="snake">Snake</option><option value="venus">Venus</option></select></label>

<script>
const actors=[{"uid":"core__snake_acid2","id":"snake","name":"Snake","source":"../animation-studies/frames/snake/walk-right-01.png","sourceGitBlob":"944f074d74db30566031a3f4d8ffae9e3af45349","canvas":[472,829],"base":"snake/body.png","layers":[{"id":"bandana","name":"Bandeau et pans arrière","file":"snake/bandana.png","x":95,"y":92,"w":229,"h":75,"nonTransparentPixels":6963},{"id":"hip-pouch","name":"Sacoche latérale","file":"snake/hip-pouch.png","x":111,"y":377,"w":121,"h":143,"nonTransparentPixels":13452},{"id":"front-knee","name":"Genouillère avant","file":"snake/front-knee.png","x":298,"y":531,"w":53,"h":81,"nonTransparentPixels":3207},{"id":"upper-shin","name":"Plaque tibiale supérieure","file":"snake/upper-shin.png","x":307,"y":607,"w":52,"h":51,"nonTransparentPixels":1945},{"id":"center-shin","name":"Plaque tibiale médiane","file":"snake/center-shin.png","x":318,"y":650,"w":52,"h":52,"nonTransparentPixels":1790},{"id":"lower-shin","name":"Plaque tibiale inférieure","file":"snake/lower-shin.png","x":344,"y":698,"w":62,"h":73,"nonTransparentPixels":2289}]},{"uid":"core__venus","id":"venus","name":"Venus","source":"../animation-studies/frames/venus/walk-right-01.png","sourceGitBlob":"1cfb103546366f7e29e30dadb4c86b6b548df9ed","canvas":[476,819],"base":"venus/body.png","layers":[{"id":"pauldron","name":"Coque d’épaule","file":"venus/pauldron.png","x":157,"y":130,"w":62,"h":69,"nonTransparentPixels":3139},{"id":"vambrace","name":"Plaque d’avant-bras gauche","file":"venus/vambrace.png","x":119,"y":208,"w":61,"h":65,"nonTransparentPixels":2475},{"id":"red-cuff","name":"Brassard rouge gauche","file":"venus/red-cuff.png","x":115,"y":275,"w":43,"h":34,"nonTransparentPixels":866},{"id":"left-bracer","name":"Manchette de poignet gauche","file":"venus/left-bracer.png","x":89,"y":339,"w":38,"h":31,"nonTransparentPixels":657},{"id":"right-bracer","name":"Manchette de poignet droit","file":"venus/right-bracer.png","x":340,"y":333,"w":35,"h":38,"nonTransparentPixels":591},{"id":"canteen","name":"Étui cylindrique gauche","file":"venus/canteen.png","x":177,"y":236,"w":29,"h":47,"nonTransparentPixels":1046},{"id":"utility-pouches","name":"Poches de ceinture","file":"venus/utility-pouches.png","x":144,"y":318,"w":112,"h":107,"nonTransparentPixels":8986}]}],menu=document.querySelector('#actor'),panel=document.querySelector('#layers'),surface=document.querySelector('canvas'),statusLine=document.querySelector('#status');let version=0;
async function selectActor(){const ticket=++version,actor=actors.find(a=>a.id===menu.value);panel.replaceChildren();surface.width=actor.canvas[0];surface.height=actor.canvas[1];statusLine.textContent='Chargement…';
const pieces=[{name:'Corps',file:actor.base,x:0,y:0},...actor.layers];
try{const images=await Promise.all(pieces.map(p=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error(p.file));im.src=p.file})));if(ticket!==version)return;
const inputs=pieces.map((p,i)=>{const label=document.createElement('label'),input=document.createElement('input'),link=document.createElement('a');input.type='checkbox';input.checked=true;input.addEventListener('change',draw);link.href=p.file;link.download='';link.textContent='PNG';link.setAttribute('aria-label','Télécharger '+p.name);label.append(input,' '+p.name+' · ',link);panel.append(label);return input});
function draw(){const ctx=surface.getContext('2d');ctx.clearRect(0,0,surface.width,surface.height);pieces.forEach((p,i)=>{if(inputs[i].checked)ctx.drawImage(images[i],p.x,p.y)});statusLine.textContent=inputs.filter(i=>i.checked).length+' / '+inputs.length+' calques visibles'}draw()
}catch(error){if(ticket===version)statusLine.textContent='Image indisponible · '+error.message}}
menu.addEventListener('change',selectActor);selectActor();</script></html>
