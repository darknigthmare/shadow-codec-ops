<!doctype html><meta charset="utf-8"><title>Original native wardrobe — three identity-specific costumes</title><style>body{margin:0;background:#071015;color:#d7eee8;font:12px monospace}header{padding:14px}#poses{display:grid;grid-template-columns:repeat(15,92px);gap:3px;padding:10px}figure{margin:0;background:#112229;border:1px solid #29454e}canvas{display:block;width:88px;height:auto}figcaption{font:9px monospace;padding:3px;color:#9bbbc3;white-space:nowrap;overflow:hidden}</style><header>Otacon — Dité technician · Mantis — personalised cyborg · Ocelot — original mechanical revolver unit</header><div id="poses"></div>
<script src="/cqc-pass19-costume-library/cqc-sprite-renderer-native-costume-semantics-v1.js"></script><script src="/cqc-pass18-application/public/cqc/src/cqc-pass17-costumes.js"></script><script src="/cqc-pass19-costume-system/cqc-pass19-costume-request-data.js"></script><script src="/cqc-pass19-costume-system/cqc-pass19-costumes.js"></script><script>
window.qaReady=(async()=>{
 const manifest=await fetch('TRIO_NATIVE_QA_MANIFEST_V1.json').then(r=>r.json()),api=CQC_COMBAT_SPRITES;
 const jobs=await Promise.all(manifest.jobs.map(async job=>({...job,base:await fetch(job.sourceEntry).then(r=>r.json()),option:await fetch(job.option).then(r=>r.json())})));
 const base=Object.fromEntries(jobs.map(j=>[j.uid,j.base]));CQC_COMBAT_SPRITE_CATALOG={schema:'cqc.combat-sprites/1',entries:base};const baseJSON=JSON.stringify(CQC_COMBAT_SPRITE_CATALOG),inputOptionJSON=JSON.stringify(jobs.map(j=>j.option));
 const configured=api.configure(CQC_COMBAT_SPRITE_CATALOG,{baseURL:new URL('./',location.href).href});if(configured.accepted!==3||configured.rejected.length)throw Error('Source body configure failure');
 const registration=CQC_PASS19_COSTUMES.registerBatch(jobs.map(j=>({uid:j.uid,option:j.option})));if(registration.accepted!==3||registration.rejected.length)throw Error('Actual production costume registration failure');
 const productionJSON=JSON.stringify(CQC_COMBAT_COSTUME_CATALOG),checks=[],seen=new Set(),pins=[],selectors=[],heights=[];
 function draw(fighter,face,pose,box,caption,append=false){const canvas=document.createElement('canvas');canvas.width=164;canvas.height=224;const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!api.drawFitted(ctx,fighter,box,face,pose))throw Error('False draw '+caption);const p=ctx.getImageData(0,0,164,224).data;let count=0,overflow=0;for(let y=0;y<224;y++)for(let x=0;x<164;x++)if(p[(y*164+x)*4+3]>=16){count++;if(x<box.x||y<box.y||x>=box.x+box.width||y>=box.y+box.height)overflow++;}if(count<20||overflow)throw Error('Empty/out-of-box '+caption);checks.push({uid:fighter.uid,costume:fighter.costume,face,caption,alpha16Pixels:count,overflow});if(append){const f=document.createElement('figure'),c=document.createElement('figcaption');c.textContent=caption;f.append(canvas,c);document.querySelector('#poses').append(f);}return canvas;}
 for(const job of jobs){const f={uid:job.uid,costume:job.family};if(!await api.whenReady(job.uid,f))throw Error('Decode failure '+job.uid);const entry=api.getEntry(job.uid,f),source=api.getEntry(job.uid,{costume:'original'});
  if(JSON.stringify(entry.actionMap)!==JSON.stringify(source.actionMap)||JSON.stringify(entry.phaseMap)!==JSON.stringify(source.phaseMap))throw Error('Original action/phase maps changed');
  if(job.family==='metalgear'){const h=CQC_PASS19_COSTUME_HEIGHTS?.[job.uid]?.[job.family];if(h?.metres!==3.2||h.absoluteHeightCertified!==false)throw Error('Original designed 3.2m scale registration missing');heights.push({uid:job.uid,costume:job.family,physicalExtent:h});}
  for(const face of [1,-1]){const directional=face===1?entry:{...entry,actions:entry.oppositeActions},oldDirectional=face===1?source:{...source,actions:source.oppositeActions};
   for(const [slot,action]of Object.entries(source.actionMap))for(const phase of ['startup','active','recovery']){const pose={moveSlot:slot,attack:true,animationActive:true,attackPhase:phase,phaseProgress:.5,time:1,actionTime:0,entityKey:'production:'+job.uid+':'+face+':'+slot+':'+phase},old=api.selectFrame(oldDirectional,pose),selected=api.selectFrame(directional,pose);if(selected.requested!==old.requested||selected.index!==old.index||selected.phase!==old.phase)throw Error('Production action/phase semantics drift');selectors.push({uid:job.uid,face,slot,phase,action:selected.action,index:selected.index,sourceAction:old.action,sourceIndex:old.index});draw(f,face,pose,{x:12,y:16,width:140,height:196,padding:5},'production '+job.uid+' '+face+' '+slot+' '+phase);}
   const nativeCases=[{getup:true},{moveSlot:'special',attack:true,animationActive:true,moveKind:'projectile',moveTag:'psionic'},{moveSlot:'light',attack:true,animationActive:true,moveKind:'melee',moveTag:'blade'},{moveSlot:'utility',attack:true,animationActive:true,moveKind:'recover'},{moveSlot:'light',attack:true,animationActive:true,moveKind:'parry'}];
   for(let i=0;i<nativeCases.length;i++){const pose={...nativeCases[i],time:1,actionTime:0,entityKey:'native-semantic:'+job.uid+':'+face+':'+i},old=api.selectFrame(oldDirectional,pose),selected=api.selectFrame(directional,pose);if(selected.requested!==old.requested||selected.index!==old.index)throw Error('Pass18 inherited semantic route lost');selectors.push({uid:job.uid,face,nativeSemanticCase:i,action:selected.action,sourceAction:old.action,index:selected.index});draw(f,face,pose,{x:12,y:16,width:140,height:196,padding:5},'native semantic '+job.uid+' '+face+' '+i);}
  }
 }
 const probes={};for(const job of jobs){const sprite=structuredClone(job.option.sprite);for(const action of Object.keys(sprite.actions))sprite.actionMap['qa_'+action]=action;probes[job.uid]={default:'original',options:[{id:'original',label:'Original'},{id:'drawproof',sprite}]};}
 const probeConfigured=api.configureCostumes({schema:'cqc.combat-costumes/1',entries:probes});if(probeConfigured.accepted!==3||probeConfigured.rejected.length)throw Error('Temporary geometry probe rejected');
 for(const job of jobs){const f={uid:job.uid,costume:'drawproof'};if(!await api.whenReady(job.uid,f))throw Error('Probe decode failure');const entry=api.getEntry(job.uid,f),start=seen.size,short=job.family==='survive'?'Ota':job.family==='cyborg'?'Man':'Oce';
  for(const face of [1,-1]){const directional=face===1?entry:{...entry,actions:entry.oppositeActions};for(const [action,definition]of Object.entries(directional.actions))for(let i=0;i<definition.frames.length;i++){const pose={moveSlot:'qa_'+action,attack:true,animationActive:true,time:1,actionTime:definition.fps?(i+.125)/definition.fps:0,entityKey:'geometry:'+job.uid+':'+face+':'+action+':'+i},selected=api.selectFrame(directional,pose),expected=definition.frames[i];if(selected.action!==action||selected.index!==i||selected.frame.file!==expected.file||JSON.stringify(selected.frame.rect)!==JSON.stringify(expected.rect))throw Error('Probe physical frame mismatch');const key=expected.file+':'+expected.rect.join(',');if(seen.has(key))continue;seen.add(key);for(const [b,box]of [{x:12,y:16,width:140,height:196,padding:5},{x:23,y:18,width:113,height:180,padding:3}].entries())draw(f,face,pose,box,short+' '+(face===1?'R':'L')+' '+action+' '+i,b===0);}}
  if(seen.size-start!==job.actualPhysicalPoses)throw Error('Exact physical source count mismatch '+job.uid);
 }
 if(seen.size!==manifest.expectedPhysicalPoses)throw Error('Expected90 actual physical frames');const restored=api.configureCostumes(CQC_COMBAT_COSTUME_CATALOG);if(restored.accepted!==3||restored.rejected.length)throw Error('Production registry restoration rejected');if(JSON.stringify(CQC_COMBAT_SPRITE_CATALOG)!==baseJSON||JSON.stringify(CQC_COMBAT_COSTUME_CATALOG)!==productionJSON||JSON.stringify(jobs.map(j=>j.option))!==inputOptionJSON)throw Error('Production/source data mutation');
 const nativeFiles=new Map(jobs.flatMap(j=>Object.values(j.option.sprite.actions).concat(Object.values(j.option.sprite.oppositeActions))).flatMap(a=>a.frames).map(f=>[f.file,f.sha256]));for(const [file,expected]of nativeFiles){const response=await fetch(file);if(!response.ok)throw Error('Native PNG read failure');const bytes=await response.arrayBuffer(),digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(n=>n.toString(16).padStart(2,'0')).join('');if(digest!==expected)throw Error('Exact native PNG hash mismatch');pins.push({file,sha256:digest,bytes:bytes.byteLength});}
 const report={schema:'cqc.pass19.trio-original-wardrobe-actual-native-browser/1',status:'passed',configured,productionRegistration:registration,temporaryProbeConfigured:probeConfigured,productionRegistryRestored:restored,actualUsedPhysicalFrames:seen.size,physicalDrawsInTwoBoxes:checks.filter(c=>c.costume==='drawproof').length,productionMoveSlotPhaseDraws:selectors.filter(s=>s.slot).length,inheritedNativeSemanticDraws:selectors.filter(s=>s.nativeSemanticCase!==undefined).length,PNGFiles:pins.length,pins,checks,productionSelectors:selectors,originalDesignedPhysicalExtents:heights,baselineCatalogueUnchanged:true,productionCostumeCatalogueUnchanged:true,inputApprovedOptionsUnchanged:true,qualification:'Real registerBatch registration, exact native PNG byte hashes,30 physical frames per identity drawn with a temporary qa action-map clone in two boxes, then original production options restored. Genuine production move slots/phases and five inherited pass18 semantic cases tested separately against original source maps. The clone is only a geometry probe, not extra production move routing. No integrated match, collision/balance or original-game animation claim.'};window.qaReport=report;return report;
})();window.qaReady.catch(e=>{window.qaError=String(e.stack||e);document.body.dataset.failed='true'});
</script>
