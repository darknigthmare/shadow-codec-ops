<!doctype html><html lang="fr"><meta charset="utf-8"><title>Référence / rig — contrôle de fidélité</title><style>body{margin:0;background:#0c1719;color:#d8e5db;font:16px system-ui}canvas{display:block}</style><canvas width="1800" height="1100"></canvas><script src="src/cqc-machine-parts-renderer-v1.js"></script><script src="src/cqc-pass19-gekko-catalog.js"></script><script src="src/cqc-pass19-gekko-poses.js"></script><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),defs=CQC_MACHINE_PARTS.normalizeCatalog(CQC_PASS19_GEKKO_CATALOG),registry=CQC_MACHINE_PARTS.create(CQC_PASS19_GEKKO_CATALOG,{baseURL:location.href}),refs={};
function bounds(m){const ts=CQC_MACHINE_PARTS.pose(m,CQC_PASS19_GEKKO_POSES.pose(m.id,{action:'idle'}));let l=Infinity,r=-Infinity,t=Infinity,b=-Infinity;for(const part of m.parts){const p=ts.get(part.id);if(!p.visible)continue;for(const [x,y]of [[0,0],[p.rect[2],0],[p.rect[2],p.rect[3]],[0,p.rect[3]]]){const a=(x-p.pivot[0])*p.imageScale,k=(y-p.pivot[1])*p.imageScale,xx=p.matrix[0]*a+p.matrix[2]*k+p.matrix[4],yy=p.matrix[1]*a+p.matrix[3]*k+p.matrix[5];l=Math.min(l,xx);r=Math.max(r,xx);t=Math.min(t,yy);b=Math.max(b,yy);}}return{l,r,t,b,w:r-l,h:b-t};}
function text(s,x,y,size=19){ctx.fillStyle='#d8e5db';ctx.font=size+'px system-ui';ctx.fillText(s,x,y);}
function imageAt(key,x,y,w,h){const im=refs[key],s=Math.min(w/im.naturalWidth,h/im.naturalHeight);ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);ctx.drawImage(im,x+(w-im.naturalWidth*s)/2,y+(h-im.naturalHeight*s)/2,im.naturalWidth*s,im.naturalHeight*s);}
function rigAt(uid,x,y,w,h){const b=bounds(defs.get(uid)),s=Math.min(w/b.w,h/b.h);ctx.save();ctx.translate(x+w/2,y+h);ctx.scale(s,s);ctx.translate(-(b.l+b.r)/2,-b.b);registry.draw(ctx,uid,CQC_PASS19_GEKKO_POSES.pose(uid,{action:'idle',frame:0}));ctx.restore();}
window.compareDraw=(mode='gekko')=>{ctx.fillStyle='#0c1719';ctx.fillRect(0,0,c.width,c.height);text('RÉFÉRENCES PHYSIQUES / ASSEMBLAGE NATIF',25,35,27);if(mode==='coat'){text('Concept original publié — MGS4',20,70);imageAt('dwarf',20,100,640,820);text('Capture / rendu original republié',680,70);imageAt('coatgame',680,100,600,450);text('Trois unités ; manches longues ; fedora',1300,70);rigAt('pass19__dwarf_gekko_trenchcoat_mgs4',1300,100,480,820);text('Tissu natif V3 : vrais caps d’épaule, manches indépendantes ; même PNG intact.',25,970);text('Tous les morceaux : imageScale uniforme positif. Aucune déformation / retouche pixel.',25,1000);}else if(mode==='mgr'){text('Capture originale MGR — R-01',20,70);imageAt('mgr',20,100,1080,620);text('Rig MGR natif',1150,70);rigAt('pass19__gekko_mgr',1150,100,610,820);text('Camouflage et châssis d’après le jeu. Les jambes restent noires et biologiques.',25,970);text('Plaques de genou / hanches métalliques attestées ; articulation 2D interprétée.',25,1000);}else{text('Rendu original MGS4',20,70);imageAt('gekko',20,100,520,800);text('Concept original : variante sombre',560,70);imageAt('concept',560,100,560,580);text('Rig missile',1140,70);rigAt('pass19__gekko_missile_mgs4',1140,100,315,800);text('Rig Suicide',1475,70);rigAt('pass19__gekko_suicide_mgs4',1475,100,305,800);text('Musculature noire + petits accents métalliques ; aucun piston chromé substitué.',25,970);text('Les sources générées interprètent les volumes ; elles ne certifient pas une identité 1:1.',25,1000);}return{mode,ready:true,sourcePixelEditingPerformed:false};};
Promise.all([...defs.keys()].map(id=>registry.load(id)).concat([['gekko','mgs4-gekko-render.jpg'],['concept','mgs4-gekko-original-concept-v2.jpg'],['dwarf','mgs4-dwarf-original-concept-v2.jpg'],['coatgame','trenchcoat-game-comparison-original.jpg'],['mgr','mgr-gekko-gameplay.png']].map(async([key,file])=>{const im=new Image();im.src='references/'+file;await im.decode();refs[key]=im;}))).then(()=>{window.comparisonReady=true;compareDraw('gekko');}).catch(e=>{window.comparisonError=e.message;});
</script></html>
