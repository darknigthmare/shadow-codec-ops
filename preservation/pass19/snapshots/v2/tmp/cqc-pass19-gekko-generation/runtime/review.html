<!doctype html><html lang="fr"><meta charset="utf-8"><title>Gekko — revue des rigs natifs</title><style>body{margin:0;background:#0d1719;color:#d4e2d6;font:16px system-ui}canvas{display:block}#status{position:fixed;top:5px;right:10px}</style><canvas id="proof" width="1800" height="1100"></canvas><span id="status">Chargement</span><script src="src/cqc-machine-parts-renderer-v1.js"></script><script src="src/cqc-pass19-gekko-catalog.js"></script><script src="src/cqc-pass19-gekko-poses.js"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),defs=CQC_MACHINE_PARTS.normalizeCatalog(CQC_PASS19_GEKKO_CATALOG),registry=CQC_MACHINE_PARTS.create(CQC_PASS19_GEKKO_CATALOG,{baseURL:location.href});
let loaded=false;const bounds={};
function transformedBounds(m,pose){const transforms=CQC_MACHINE_PARTS.pose(m,pose);let left=Infinity,right=-Infinity,top=Infinity,bottom=-Infinity;for(const part of m.parts){const p=transforms.get(part.id);if(!p.visible)continue;const r=p.rect;for(const [x,y]of [[0,0],[r[2],0],[r[2],r[3]],[0,r[3]]]){const a=(x-p.pivot[0])*p.imageScale,b=(y-p.pivot[1])*p.imageScale,px=p.matrix[0]*a+p.matrix[2]*b+p.matrix[4],py=p.matrix[1]*a+p.matrix[3]*b+p.matrix[5];left=Math.min(left,px);right=Math.max(right,px);top=Math.min(top,py);bottom=Math.max(bottom,py);}}return{left,right,top,bottom,width:right-left,height:bottom-top};}
window.reviewDraw=function(action='idle',frame=0,phaseProgress=.5,options={}){ctx.fillStyle='#0d1719';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.font='22px system-ui';ctx.fillStyle='#c5e6cd';ctx.fillText('PIÈCES NATIVES — '+action.toUpperCase(),25,35);const rows=[];[...defs.values()].forEach((m,i)=>{const col=i%3,row=Math.floor(i/3),box={x:col*600+20,y:row*520+70,w:560,h:460};const b=bounds[m.id];const scale=Math.min(box.w/b.width,box.h/b.height),pose=CQC_PASS19_GEKKO_POSES.pose(m.id,{action,frame,phaseProgress,...options});ctx.save();ctx.translate(box.x+box.w/2,box.y+box.h);ctx.scale(scale,scale);ctx.translate(-(b.left+b.right)/2,-b.bottom);const drawn=registry.draw(ctx,m.id,pose);ctx.restore();ctx.font='16px system-ui';ctx.fillStyle='#c5e6cd';ctx.fillText(m.edition,box.x,box.y+box.h+23);ctx.strokeStyle='#426158';ctx.beginPath();ctx.moveTo(box.x,box.y+box.h);ctx.lineTo(box.x+box.w,box.y+box.h);ctx.stroke();rows.push({id:m.id,drawn,bounds:transformedBounds(m,pose),neutral:b});});return rows;};
Promise.all([...defs.keys()].map(id=>registry.load(id))).then(()=>{for(const m of defs.values())bounds[m.id]=transformedBounds(m,CQC_PASS19_GEKKO_POSES.pose(m.id,{action:'idle',frame:0}));loaded=true;reviewDraw();document.querySelector('#status').textContent='Natif prêt';}).catch(e=>{document.querySelector('#status').textContent=e.message;window.reviewError=e.message;});window.reviewReady=()=>loaded;window.reviewStatus=()=>[...defs.keys()].map(id=>registry.status(id));
</script></html>
