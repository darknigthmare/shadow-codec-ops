<!doctype html><meta charset="utf-8"><title>Native NextGen Source Geometry QA</title><style>body{margin:0;background:#071015;color:#b6c9c9;font:12px monospace}#poses{display:grid;grid-template-columns:repeat(8,160px);gap:4px}figure{margin:0;background:#112229}canvas{display:block}figcaption{padding:4px;font-size:10px}</style><div id="poses"></div>
<script src="/cqc-pass19-costume-system/cqc-sprite-renderer.js"></script><script src="/cqc-pass18-application/public/cqc/src/cqc-pass17-costumes.js"></script><script src="/cqc-pass19-costume-system/cqc-pass19-costume-request-data.js"></script><script src="/cqc-pass19-costume-system/cqc-pass19-costumes.js"></script><script>
window.qaReady=(async()=>{
const ids=['core__snake_gb','core__chris_jenner','core__campbell_mpo','core__cunningham'],api=CQC_COMBAT_SPRITES;
const base=Object.fromEntries(await Promise.all(ids.map(async uid=>[uid,await fetch('source-entries/'+uid+'.json').then(r=>r.json())])));CQC_COMBAT_SPRITE_CATALOG={schema:'cqc.combat-sprites/1',entries:base};const originalJSON=JSON.stringify(CQC_COMBAT_SPRITE_CATALOG);
const configured=api.configure(CQC_COMBAT_SPRITE_CATALOG,{baseURL:new URL('./',location.href).href});if(configured.accepted!==4||configured.rejected.length)throw Error('Base configure failure');
await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='cqc-pass19-nextgen-native-costumes.js';s.onload=resolve;s.onerror=reject;document.head.append(s)});
if(CQC_PASS19_NEXTGEN_REGISTRATION.accepted!==4)throw Error('Production registration failure');const productionJSON=JSON.stringify(CQC_COMBAT_COSTUME_CATALOG),checks=[],seen=new Set(),pins=[];
const canvas=()=>{const c=document.createElement('canvas');c.width=160;c.height=220;return c};
function drawCheck(fighter,face,pose,box,caption,record=true){const c=canvas(),ctx=c.getContext('2d',{willReadFrequently:true});if(!api.drawFitted(ctx,fighter,box,face,pose))throw Error('False native draw '+caption);const d=ctx.getImageData(0,0,c.width,c.height).data;let count=0,overflow=0;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>=16){count++;if(x<box.x||y<box.y||x>=box.x+box.width||y>=box.y+box.height)overflow++}if(count<20||overflow)throw Error('Empty/overflow native draw '+caption+':'+count+':'+overflow);checks.push({uid:fighter.uid,face,costume:fighter.costume,caption,alpha16Pixels:count,overflow});if(record){const f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=caption;f.append(c,cap);document.getElementById('poses').append(f)}return c;}
for(const uid of ids){const f={uid,costume:'nextgen'};if(!await api.whenReady(uid,f))throw Error('Decode failure '+uid);const entry=api.getEntry(uid,f);for(const face of [1,-1]){const directional=face===1?entry:{...entry,actions:entry.oppositeActions};for(const [slot,action]of Object.entries(entry.actionMap||{})){for(const phase of ['startup','active','recovery']){const pose={moveSlot:slot,attack:true,animationActive:true,attackPhase:phase,phaseProgress:.5,time:1,actionTime:0,entityKey:'production:'+uid+':'+face+':'+slot+':'+phase};const selected=api.selectFrame(directional,pose);if(selected.requested!==action)throw Error('Production slot map drift');drawCheck(f,face,pose,{x:7,y:8,width:145,height:205,padding:4},'production '+uid+' '+face+' '+slot+' '+phase,false)}}}}
const proofEntries={};for(const uid of ids){const option=CQC_PASS19_COSTUMES.optionFor(uid,'nextgen'),sprite=structuredClone(option.sprite);for(const action of Object.keys(sprite.actions))sprite.actionMap['qa_'+action]=action;
if(uid==='core__chris_jenner'){const layouts=await Promise.all(['right','left'].map(side=>fetch('generation/'+uid+'/'+side+'-native-layout-v1.json').then(r=>r.json())));for(let n=0;n<2;n++){const p=layouts[n].poses[9],file=sprite[n===0?'actions':'oppositeActions'].idle.frames[0].file;const frame={file,sha256:layouts[n].sha256,rect:p.rect,pivot:p.pivot,...p.clipPolygon?{clipPolygon:p.clipPolygon}:{}};sprite[n===0?'actions':'oppositeActions'].blade={fps:0,loop:false,frames:[frame]}}sprite.actionMap.qa_blade='blade';}
proofEntries[uid]={default:'original',options:[{id:'original',label:'Original'},{id:'drawproof',sprite}]};}
const probeConfigured=api.configureCostumes({schema:'cqc.combat-costumes/1',entries:proofEntries});if(probeConfigured.accepted!==4||probeConfigured.rejected.length)throw Error('Draw-only probe configure failure');
for(const uid of ids){const f={uid,costume:'drawproof'};if(!await api.whenReady(uid,f))throw Error('Probe decode failure');const entry=api.getEntry(uid,f);for(const face of [1,-1]){const directional=face===1?entry:{...entry,actions:entry.oppositeActions};for(const [action,definition]of Object.entries(directional.actions))for(let i=0;i<definition.frames.length;i++){const pose={moveSlot:'qa_'+action,attack:true,animationActive:true,time:1,actionTime:definition.fps?(i+.125)/definition.fps:0,entityKey:'geometry:'+uid+':'+face+':'+action+':'+i};const selected=api.selectFrame(directional,pose),expected=definition.frames[i];if(selected.action!==action||selected.index!==i||JSON.stringify(selected.frame.rect)!==JSON.stringify(expected.rect))throw Error('Source physical group mismatch');const key=expected.file+':'+expected.rect.join(',');if(seen.has(key))continue;seen.add(key);for(const [b,box]of[{x:7,y:8,width:145,height:205,padding:4},{x:24,y:20,width:112,height:177,padding:3}].entries())drawCheck(f,face,pose,box,uid+' '+face+' '+action+' '+i,b===0);}}}
if(seen.size!==128)throw Error('Expected128 independent physical draws, got'+seen.size);
const restored=api.configureCostumes(CQC_COMBAT_COSTUME_CATALOG);if(restored.accepted!==4||restored.rejected.length||JSON.stringify(CQC_COMBAT_SPRITE_CATALOG)!==originalJSON||JSON.stringify(CQC_COMBAT_COSTUME_CATALOG)!==productionJSON)throw Error('Source/catalog data mutation');
const files=new Map(ids.flatMap(uid=>Object.values(CQC_PASS19_COSTUMES.optionFor(uid,'nextgen').sprite.actions).concat(Object.values(CQC_PASS19_COSTUMES.optionFor(uid,'nextgen').sprite.oppositeActions)).flatMap(action=>action.frames)).map(frame=>[frame.file,frame.sha256]));for(const [file,expected]of files){const response=await fetch(file),bytes=await response.arrayBuffer(),digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(n=>n.toString(16).padStart(2,'0')).join('');if(digest!==expected)throw Error('Native PNG browser hash mismatch');pins.push({file,sha256:digest,bytes:bytes.byteLength})}
const report={schema:'cqc.pass19.nextgen-actual-native-browser/1',status:'passed',configured,productionRegistration:CQC_PASS19_NEXTGEN_REGISTRATION,drawProbeConfigured:probeConfigured,restoredProduction:restored,actualPhysicalFigures:seen.size,PNGFiles:pins.length,productionDraws:checks.filter(c=>c.costume==='nextgen').length,physicalDrawsInTwoBoxes:checks.filter(c=>c.costume==='drawproof').length,checks,pins,baselineCatalogueUnchanged:true,productionCostumeCatalogueUnchanged:true,qualification:'Actual original final modules register four options, decode and hash8 native PNGs, exercise production move-slot maps and draw128 independent physical poses in two boxes. The draw-only clone adds qa action-map keys and one unused physical grenade keyframe for complete geometry coverage, then production entries are restored unchanged. No match-scene or combat balance claim.'};window.qaReport=report;return report;
})();window.qaReady.catch(e=>{window.qaError=String(e.stack||e);document.body.dataset.failed='true'});
</script>
